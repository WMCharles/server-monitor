# Keep application logs bounded so `/logs` tailing stays cheap and disks do
# not fill. Install to /etc/logrotate.d/ and adjust the path/owner as needed.
#
# The `su` directive is required because Laravel's storage/logs directory is
# typically world-/group-writable, which logrotate refuses to touch otherwise.
# `copytruncate` avoids needing the app to reopen its log file.

/var/www/html/ridemeds/storage/logs/*.log {
    su zogratis www-data
    daily
    rotate 7
    size 20M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
}
